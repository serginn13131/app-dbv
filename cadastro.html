<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

"use strict";


// =====================================================
// SUPABASE
// =====================================================

const banco =
    window.supabaseClient;


if (!banco) {

    console.error(
        "Supabase não foi inicializado."
    );

}


// =====================================================
// ELEMENTOS
// =====================================================

const formulario =
    document.getElementById("cadastroForm");


const botao =
    document.getElementById("cadastroButton");


const mensagem =
    document.getElementById("cadastroMensagem");


const senha =
    document.getElementById("password");


const confirmarSenha =
    document.getElementById("passwordConfirm");


const toggleSenha =
    document.getElementById(
        "toggleCadastroPassword"
    );


// =====================================================
// MOSTRAR / ESCONDER SENHA
// =====================================================

toggleSenha.addEventListener(
    "click",
    function() {

        if (
            senha.type ===
            "password"
        ) {

            senha.type =
                "text";

            this.textContent =
                "🙈";

            this.setAttribute(
                "aria-label",
                "Ocultar senha"
            );

        } else {

            senha.type =
                "password";

            this.textContent =
                "👁️";

            this.setAttribute(
                "aria-label",
                "Mostrar senha"
            );

        }

    }
);


// =====================================================
// MENSAGEM
// =====================================================

function mostrarMensagem(
    texto,
    tipo
) {

    mensagem.textContent =
        texto;

    mensagem.className =
        "login-message show " + tipo;

}


// =====================================================
// CADASTRO
// =====================================================

formulario.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        if (!banco) {

            mostrarMensagem(
                "O Supabase não foi inicializado.",
                "error"
            );

            return;

        }


        const nome =
            document
                .getElementById("nome")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const senhaValor =
            senha.value;


        const confirmarValor =
            confirmarSenha.value;


        // =============================================
        // VALIDAÇÕES
        // =============================================

        if (nome.length < 3) {

            mostrarMensagem(
                "Digite seu nome completo.",
                "error"
            );

            return;

        }


        if (
            senhaValor.length <
            6
        ) {

            mostrarMensagem(
                "A senha precisa ter pelo menos 6 caracteres.",
                "error"
            );

            return;

        }


        if (
            senhaValor !==
            confirmarValor
        ) {

            mostrarMensagem(
                "As senhas não são iguais.",
                "error"
            );

            return;

        }


        // =============================================
        // BLOQUEAR BOTÃO
        // =============================================

        botao.disabled =
            true;

        botao.textContent =
            "Criando conta...";


        mensagem.className =
            "login-message";


        try {


            // =========================================
            // CRIAR CONTA NO SUPABASE AUTH
            // =========================================

            const {

                data,

                error

            } = await banco.auth.signUp({

                email: email,

                password: senhaValor,

                options: {

                    data: {

                        nome: nome

                    }

                }

            });


            if (error) {

                console.error(
                    "Erro no cadastro:",
                    error
                );


                if (
                    error.message
                        .toLowerCase()
                        .includes("already registered")
                ) {

                    mostrarMensagem(
                        "Este e-mail já possui uma conta.",
                        "error"
                    );

                } else {

                    mostrarMensagem(
                        error.message,
                        "error"
                    );

                }


                return;

            }


            // =========================================
            // VERIFICAR USUÁRIO
            // =========================================

            if (!data?.user) {

                mostrarMensagem(
                    "A conta não pôde ser criada.",
                    "error"
                );

                return;

            }


            // =========================================
            // SUCESSO
            // =========================================

            mostrarMensagem(
                "✅ Conta criada com sucesso! Aguarde a aprovação da administração.",
                "success"
            );


            formulario.reset();


            // =========================================
            // REDIRECIONAR
            // =========================================

            setTimeout(
                function() {

                    window.location.href =
                        "login.html";

                },
                2500
            );


        } catch (erro) {

            console.error(
                "Erro inesperado:",
                erro
            );


            mostrarMensagem(
                "Ocorreu um erro ao criar sua conta.",
                "error"
            );


        } finally {

            botao.disabled =
                false;

            botao.textContent =
                "Criar minha conta";

        }

    }
);

</script>


</body>

</html>
